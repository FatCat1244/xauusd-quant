[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "xauusd-quant"
version = "0.1.0"
description = "Quantitative research platform for XAUUSD: data pipeline, statistical, regression, OU, spectral and wavelet research layers (descriptive only)."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "xauusd-quant" }]
keywords = ["quantitative-finance", "xauusd", "gold", "tick-data", "parquet", "polars"]
classifiers = ["Private :: Do Not Upload", "Programming Language :: Python :: 3.12"]

dependencies = [
    "polars>=1.20",
    "pyarrow>=18",
    "duckdb>=1.1",
    "numpy>=2.0",
    "PyYAML>=6.0",
    "rich>=13.0",
    "tzdata>=2024.1 ; sys_platform == 'win32'",
]

[project.optional-dependencies]
mt5 = ["MetaTrader5==5.0.6231 ; sys_platform == 'win32'"]
# The core pipeline (ticks -> Parquet -> bars -> queries) needs none of these.
# `xauusd_quant.research` does, and the CLI imports it lazily so that
# `xq convert` still works on a bare install.
research = [
    "scipy>=1.14",
    "statsmodels>=0.14",
    "matplotlib>=3.9",
    "PyWavelets>=1.8",
]
notebooks = [
    "scipy>=1.14",
    "statsmodels>=0.14",
    "matplotlib>=3.9",
    "PyWavelets>=1.8",
    "jupyterlab>=4.2",
]
# Prompt #10 supervised predictive research (`xauusd_quant.ml`); imported lazily.
ml = [
    "scikit-learn>=1.9",
    "xgboost>=3.4",
    "lightgbm>=4.7",
    "catboost>=1.2.10",
    "shap>=0.52",
    "joblib>=1.6",
]
dev = [
    "scipy>=1.14",
    "statsmodels>=0.14",
    "matplotlib>=3.9",
    "PyWavelets>=1.8",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
xq = "xauusd_quant.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/xauusd_quant"]

# ----------------------------------------------------------------------------
# Tooling
# ----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "PTH", "RET", "ARG", "TID"]
# E501: line length is enforced by the formatter, not the linter.
# TID252: intra-package relative imports are the deliberate style here - they
#         keep the package relocatable and make the layering obvious.
ignore = ["E501", "TID252"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG"]

[tool.ruff.lint.isort]
known-first-party = ["xauusd_quant"]


[tool.mypy]
python_version = "3.12"
packages = ["xauusd_quant"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error::DeprecationWarning:xauusd_quant.*"]
markers = [
    "slow: tests that take more than a few seconds",
    "realdata: tests that require the real XAUUSD dataset to be present",
]
