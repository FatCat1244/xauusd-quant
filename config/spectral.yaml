# Fourier / spectral research of the regression residual, the OU innovation
# and log returns (Prompt #5).
#
# Descriptive research only. No value below was chosen for trading
# performance, and nothing produced from it is a trading signal. Every
# spectral statistic is reported beside null controls (white noise, a
# detrended random walk, shuffled and block-bootstrapped returns), because a
# spectral peak can come from finite samples, windowing, detrending or
# volatility clustering alone.

schema_version: "1.0.0"

timeframes: [1m, 5m, 15m, 30m, 1h]

# Which Prompt #3 residual and Prompt #4 OU fit the inputs are taken from:
# the representative pair of the OU layer.
regression_window: 128
ou_window: 256

# regression_residual  epsilon_t of the rolling regression (Prompt #3)
# ou_innovation        eta_t = X_t - (a_{t-1} + b_{t-1} X_{t-1}): the one-step
#                      error of the previous bar's rolling OU fit (causal)
# log_return           r_t = ln(P_t / P_{t-1}), the baseline
# Also available, not run by default: abs_ou_innovation (|eta_t|).
input_series: [regression_residual, ou_innovation, log_return]

fft_windows: [64, 128, 256, 512, 1024]
representative_fft_window: 256

results_path: "${XAUUSD_SPECTRAL_RESULTS:-results/spectral_research}"

preprocessing:
  window_function: hann          # hann | rectangular | hamming | blackman
  remove_mean: true              # subtract each window's own mean
  detrend_input: false           # a linear detrend inside the window, off by default
  # A window whose bars span unscheduled gaps (not weekends, not the daily
  # break) with more than this share of missing bar slots is skipped: the FFT
  # assumes regular sampling and nothing is filled in.
  missing_bar_tolerance: 0.05

spectrum:
  minimum_frequency_index: 1     # DC (index 0) is never a "component"
  exclude_nyquist_if_needed: true
  top_frequencies: 5
  # A component's phase is reported only if it holds at least this share of
  # the window's power; below it the phase is noise and is left null.
  phase_min_power_share: 0.02
  zero_power_tolerance: 1.0e-30

power_bands:
  enabled: true
  # Edges in normalised frequency f / f_Nyquist, lowest first. With N bars the
  # bin resolution is 2/N of this scale, so the low band of a short window
  # holds only a few bins - read band shares with N in mind.
  edges: [0.0, 0.1, 0.4, 1.0]
  names: [low, mid, high]

spectral_entropy:
  enabled: true
  normalise: true                # H / ln K, in [0, 1]

rolling_fft:
  enabled: true
  chunk_elements: 4000000        # values per FFT batch (memory, not results)
  workers: -1                    # scipy.fft threads; -1 = all cores

persistence:
  top_k: 5
  relative_tolerance: 0.10       # |f1 - f2| / f1 below this counts as the same frequency
  lags_in_windows: [0.25, 0.5, 1.0, 2.0]   # lag h as a multiple of the FFT window
  lags_in_bars: [1]

reconstruction:
  components: [1, 3, 5, 10]
  horizons: [1, 2, 3, 5, 10]
  max_windows: 100000            # evenly spaced sample of windows; figures are estimates

phase:
  buckets: 8
  horizons: [1, 2, 5, 10]

outcomes:
  horizons: [1, 5, 10, 20]
  extreme_abs_z: 2.0
  buckets: 4

ic:
  features:
    - spectral_entropy
    - spectral_flatness
    - spectral_centroid_norm
    - top1_power_share
    - top3_power_share
    - low_power_share
    - high_power_share
    - log_dominant_period
    - dominant_phase_sin
    - dominant_phase_cos
  targets: [future_return, future_residual_change, future_abs_residual_reduction]
  horizons: [1, 2, 3, 5, 10, 20]
  max_rows: 1000000              # evenly spaced sample per study; ICs are estimates
  max_rows_control: 300000

conditioning:
  volatility_buckets: 4
  trend_buckets: 5
  ou_speed_buckets: 3
  time_basis: timestamp
  by_hour: true
  by_session: true
  min_samples_warning: 200

stability:
  eras: 3
  change_quantiles: [0.01, 0.05, 0.25, 0.5, 0.75, 0.95, 0.99]

controls:
  white_noise: true
  random_walk: true
  shuffled_returns: true
  block_bootstrap: true
  block_size: 256                # bars per resampled block
  seed: 20260925

features_output:
  # Per-bar spectral features for later ML, as partitioned Parquet:
  # <path>/timeframe=<tf>/source=<series>/fft_window=<N>/year=<YYYY>/
  # representative: only the representative FFT window; all: every window.
  write: representative
  path: "${XAUUSD_SPECTRAL_FEATURES:-data/features/spectral}"
  top_components: 3
  float32: true

plots:
  enabled: true
  format: png
  dpi: 130
  figsize: [11.0, 6.0]
  sample_bars: 3000
  spectrogram_bars: 1500
  max_series_points: 20000

output:
  write_parquet: true
  write_csv: true
  write_json: true

grid:
  # A timeframe with more bars than this is refused by --all unless
  # --allow-heavy is given (1m: 7.9M bars x 5 sources x series x windows).
  max_bars_without_override: 3000000

ledger:
  enabled: true
  path: "${XAUUSD_RESEARCH_LEDGER:-results/research_ledger.parquet}"
