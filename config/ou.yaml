# ===========================================================================
# xauusd-quant - Ornstein-Uhlenbeck residual research configuration
#
# The fourth layer. It asks whether the rolling-regression residual of
# `config/regression.yaml` can be approximated by an Ornstein-Uhlenbeck
# process, and whether the parameters that approximation implies are stable.
#
#   dX_t = theta * (mu - X_t) dt + sigma dW_t
#
# sampled once per bar is exactly the AR(1)
#
#   X_{t+1} = a + b X_t + eta_t,   b = exp(-theta dt),   a = mu (1 - b)
#
# so the model is estimated as an AR(1) by OLS and mapped back to
# (theta, mu, sigma) only where that mapping exists (0 < b < 1).
#
# Nothing here is a trading parameter. The windows are a comparison grid chosen
# before any result was seen; none of them is selected, ranked or optimised,
# and no transaction cost, entry, exit or size exists anywhere in this layer.
# ===========================================================================

schema_version: "1.0.0"

# Where OU tables, summaries and plots are written.
results_path: "${XAUUSD_OU_RESULTS:-results/ou_research}"

timeframes: ["1m", "5m", "15m", "30m", "1h"]

# The regression window N whose residual is being modelled. The regression
# itself is still defined by config/regression.yaml; these are simply the
# residual series studied here.
regression_windows: [32, 64, 128, 256, 512]

# The OU estimation window M: how many residual observations each rolling AR(1)
# fit uses. M observations give M-1 (X_t, X_{t+1}) pairs. The window ENDS at t
# and nothing later enters it.
ou_estimation_windows: [64, 128, 256, 512]

# Only ordinary least squares on the AR(1) form is implemented. The list exists
# so that a second estimator can be added beside it rather than replacing it.
estimation_methods: ["ar1_ols"]

# Static fits - whole sample, year, quarter, hour, session - need at least this
# many (X_t, X_{t+1}) pairs before a number is reported.
min_observations: 50

# Time between consecutive residual observations, in the unit theta is quoted
# in. 1.0 = one bar, so theta is per bar and half-lives are in bars. A weekend
# is one bar like any other: the regression is defined on bar counts, not on
# clock time, and the OU layer inherits that convention.
dt: 1.0

# An AR(1) fit is only given an OU reading when valid_b_range.min < b <
# valid_b_range.max. The mathematical range is (0, 1) and these may only narrow
# it. b outside (0, 1) is never forced into theta = -ln(b):
#   b <= 0       non-positive: sign-flipping, no continuous OU equivalent
#   b ~= 1       unit root: no finite half-life
#   b >  1       explosive: not mean-reverting at all
valid_b_range:
  min: 0.0
  max: 1.0

# The (N, M) pair shown in the multi-timeframe table. It is the middle of each
# grid, fixed before looking at any result. It is a presentation default, NOT a
# selection - every pair is reported in the window matrix.
representative:
  regression_window: 128
  ou_window: 256

half_life:
  # A half-life above this many bars corresponds to b > 0.99993. Such a value
  # is numerically computable and statistically meaningless, so the window is
  # classed `near_unit_root` and no half-life, theta, mu or sigma is reported
  # for it. The count of such windows is always reported instead.
  max_reportable_bars: 10000
  quantiles: [0.05, 0.25, 0.50, 0.75, 0.95]

near_unit_root:
  # Descriptive lines only - the share of windows with b above each is
  # reported. They are not thresholds for anything.
  thresholds: [0.95, 0.99]
  # Sets the per-row `ou_near_unit_root` flag.
  flag_threshold: 0.99

numerical:
  # |b - 1| below this is treated as an exact unit root.
  unit_root_tolerance: 1.0e-9
  # Per-pair variance of the regressor below which b is undefined (a flat
  # residual window). Such windows are `degenerate`, never a huge number.
  min_regressor_variance: 1.0e-20
  # SSE below this fraction of the response variance counts as a perfect fit:
  # sigma is then 0 and the OU Z-score is left null rather than infinite.
  zero_innovation_tolerance: 1.0e-12
  # The rolling estimator accumulates sums in blocks of this many rows, each
  # shifted by a causal local constant, so rounding error stays bounded
  # regardless of series length.
  chunk_rows: 16384

rolling_estimation:
  enabled: true
  # Which (N, M) pairs get a per-bar parameters.parquet:
  #   representative - the one pair named above, per timeframe (default)
  #   all            - every pair (~0.5 GB per pair on 23 years of 1m bars)
  #   none
  # Every pair's summary tables are always written; the per-bar table is
  # regenerated in seconds by `xq ou-research ... --write-parameters`.
  write_parameters: representative

segmented_estimation:
  yearly: true
  quarterly: true
  # A calendar segment needs this many pairs for a static fit.
  min_observations: 500

equilibrium:
  confidence_level: 0.95
  # Newey-West lags for the standard errors of a, b and mu in static fits.
  newey_west_lags: "auto"       # auto -> 4*(n/100)^(2/9), or an integer
  # |mu| above this fraction of the residual std, with a confidence interval
  # that excludes zero, is flagged for investigation.
  material_fraction_of_std: 0.10

expected_path:
  # Horizons (bars) for the model expectation E[X_{t+h} | X_t].
  horizons: [1, 2, 3, 5, 10, 20, 50]
  # Expected share of the deviation remaining after this many bars ...
  decay_bars: [1, 5, 10]
  # ... and after this many estimated half-lives (0.5, 0.25, 0.125 in theory).
  decay_half_lives: [1, 2, 3]

# Outcome analysis. Every forward value here is an OUTCOME: it never enters an
# estimate, a threshold or a conditioning variable.
extremes:
  # |Z_OU| levels studied. Reference levels, not entries.
  abs_z_levels: [1.0, 2.0, 3.0]
  # The level that defines "extreme" in the forecast comparison and the
  # realized-versus-estimated half-life study.
  primary_abs_z: 2.0
  forward_horizons: [1, 5, 10, 20]
  # Search horizon for first passage, half-decay and equilibrium crossing.
  # Starts without this much future are excluded; starts that never arrive
  # within it are counted as censored, never dropped.
  max_horizon: 500
  # Horizon for the maximum move FURTHER from equilibrium.
  adverse_horizon: 50
  first_passage_fractions: [0.75, 0.50, 0.25]
  min_samples_warning: 200
  # Write the per-event table for starts beyond primary_abs_z.
  write_events: true

stability:
  # Trailing bars for the rolling median / IQR / CV of the rolling half-life.
  rolling_window: 1000
  # A half-life that changes by more than this factor between consecutive
  # calendar segments is flagged as a large shift.
  segment_shift_factor: 2.0
  # Adjacent-bar changes larger than this factor count as a jump.
  jump_factor: 1.5

conditioning:
  volatility_buckets: 4
  # Quintiles: strongly negative, weak negative, near flat, weak positive,
  # strongly positive.
  trend_buckets: 5
  r_squared_buckets: 4
  time_basis: timestamp         # timestamp (broker clock) | timestamp_utc
  by_hour: true
  by_session: true              # sessions come from config/research.yaml
  min_samples_warning: 200

diagnostics:
  # Innovation ACF lags 1..max_lag, as the prompt specifies ...
  max_lag: 50
  ljung_box_lags: [1, 5, 10, 20, 50]
  # ... plus single structural lags that can carry mechanical structure: the
  # regression window N, the OU window M and one trading day of bars.
  structural_lags: true
  arch_lags: 10
  confidence_level: 0.95
  # ARCH-LM and normality tests run on an evenly spaced subsample above this.
  max_observations: 500000

controls:
  # The same pipeline on a detrended Gaussian random walk (no mean reversion
  # at all, same number of bars, step size matched to the data's own log
  # returns). Required: detrending alone makes any series look OU-like, so a
  # number without this beside it cannot be read.
  random_walk: true
  # The same pipeline on an exact OU simulation whose parameters are the
  # whole-sample fit. This is what the statistics would look like if the
  # residual really were one constant-parameter OU process - estimation noise,
  # small-window bias and first-passage effects included.
  ou_reference: true
  # A path built from the data's own log returns in shuffled order: the exact
  # marginal distribution (fat tails included) with every serial dependence
  # destroyed. Registered for later work; off by default to save compute.
  shuffled_returns: false
  seed: 20260924

plots:
  enabled: true
  format: png
  dpi: 130
  figsize: [11, 6]
  # Recent bars shown in the equilibrium and Z-score panels.
  sample_bars: 2000
  # Full-span time-series panels are thinned to at most this many points.
  max_series_points: 20000
  max_scatter_points: 40000

output:
  write_parquet: true
  write_csv: true
  write_json: true
